 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetcode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Leetcode</h1>
        <div class="user-container">
            <p>Enter your username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter your username here" id="user-input"/>
                <button id="search-btn">Search</button>
            </div>
        </div>

        <div class="stack-container"></div>

        <div class="progress">

            <div class="progress-item circle">
                <div class="easy-progress">
                    <span id="easy-level"></span>
                    Easy
                </div>
            </div>

            <div class="progress-item circle">
                <div class="medium-progress">
                    <span id="medium-progress"></span>
                    Medium
                </div>
            </div>

            <div class="progress-item circle">
                <div class="hard-progress">
                    <span id="hard-level"></span>
                    Hard
                </div>
            </div>
        </div>

        <div class="stats-card"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
