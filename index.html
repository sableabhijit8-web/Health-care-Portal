 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub + Health Dashboard</title>
    <link rel="stylesheet" href="sty.css" />
</head>
<body>
    <header>
        <h1>GitHub + Health Dashboard</h1>
        <div id="clock"></div>
        <button id="toggle-dark-mode">Toggle Dark Mode</button>
    </header>

    <section id="search-section">
        <input type="text" id="user-input" placeholder="Enter GitHub username" />
        <button id="search-btn">Search</button>
    </section>

    <section id="profile-section">
        <a id="profile-link" target="_blank">
            <img id="avatar" src="" alt="Avatar" />
        </a>
        <div id="profile-info">
            <h2 id="name"></h2>
            <p id="bio"></p>
            <p><strong>Followers:</strong> <span id="followers"></span></p>
            <p><strong>Following:</strong> <span id="following"></span></p>
            <p><strong>Public Repos:</strong> <span id="repos"></span></p>
            <p><strong>Joined:</strong> <span id="join-date"></span></p>
        </div>
    </section>

    <section class="stats-container">
        <div class="stat">
            <h3>Easy</h3>
            <div class="circle easy-progress">0%</div>
        </div>
        <div class="stat">
            <h3>Medium</h3>
            <div class="circle medium-progress">0%</div>
        </div>
        <div class="stat">
            <h3>Hard</h3>
            <div class="circle hard-progress">0%</div>
        </div>
    </section>

    <section id="search-history-section">
        <h3>Search History</h3>
        <ul id="search-history"></ul>
        <button id="clear-history-btn">Clear History</button>
    </section>

    <script src="javascript.js"></script>
</body>
</html>
