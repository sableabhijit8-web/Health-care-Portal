<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Care - Patient Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="login.css"/>
</head>
<body class="dark-mode">

  <div class="login-container">
    <form id="login-form">
      <h1>Patient Login</h1>
      
      <div class="theme-controls">
        <button id="toggle-dark-mode" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">🌙</button>
        <select id="theme-selector" aria-label="Select Theme">
          <option value="default">Default</option>
          <option value="dark">Dark</option>
          <option value="blue">Blue</option>
        </select>
      </div>
      
      <p class="subtitle">Please log in to book appointments.</p>
      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. patient" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="e.g. pass123" required />
      </div>

      <button type="submit" id="login-btn">Login</button>
      
      <p id="error-message" class="error-message hidden">
        Invalid username or password.
      </p>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
